<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ClassSync</title>
  <meta name="description" content="Sign in to your ClassSync account to access your classrooms, homework assignments, and learning resources.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2rem; color: var(--primary-color); margin-bottom: 0.5rem;">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h1 class="page-title">Welcome Back</h1>
        <p class="card-subtitle" style="margin-bottom: 0;">Sign in to your ClassSync workspace</p>
      </div>

      <form id="login-form">
        <div id="login-error" class="form-error-msg" style="display: none; margin-bottom: 1rem;"></div>

        <div class="form-group">
          <label for="login-email">Email Address *</label>
          <input type="email" id="login-email" class="form-control" placeholder="your_email@domain.com" required>
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label for="login-password" style="margin-bottom: 0;">Password *</label>
            <a href="/forgot-password.html" style="font-size: 0.8rem;">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="padding: 0.75rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Log In to ClassSync
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="font-weight: 600;">Register Account</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ClassSync</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.5rem; font-weight: 700;">Welcome Back</h1>
        <p class="card-subtitle">Sign in to your ClassSync account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address *</label>
          <input type="email" id="login-email" class="form-control" placeholder="your_email@domain.com" required>
        </div>
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="login-password">Password *</label>
            <a href="/forgot-password.html" style="font-size: 0.8rem;">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="Enter password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        Don't have an account? <a href="/register.html">Register Now</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>

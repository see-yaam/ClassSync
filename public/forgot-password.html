<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - ClassSync</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.5rem; font-weight: 700;">Reset Password</h1>
        <p class="card-subtitle">Enter your email to receive a password reset OTP</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="forgot-email">Account Email Address *</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="your_email@domain.com" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">Send Reset Code</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        Remembered your password? <a href="/login.html">Log In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - ClassSync</title>
  <meta name="description" content="Register a new account on ClassSync to join academic classrooms as an instructor, TA, or learner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2rem; color: var(--primary-color); margin-bottom: 0.5rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="page-title">Create Your Account</h1>
        <p class="card-subtitle" style="margin-bottom: 0;">Join ClassSync as an instructor or learner</p>
      </div>

      <form id="register-form">
        <div id="register-error" class="form-error-msg" style="display: none; margin-bottom: 1rem;"></div>

        <div class="form-group">
          <label for="reg-fullname">Full Name *</label>
          <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Seyam Bhuyan" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="your_email@domain.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
          <label for="reg-avatar">Profile Picture <span style="font-weight: normal; color: var(--text-muted); font-size: 0.85rem;">(Optional)</span></label>
          <div style="display: flex; align-items: center; gap: 1rem; margin-top: 0.25rem;">
            <div id="avatar-preview-container" style="width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: var(--border-color); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid var(--primary-color);">
              <i class="fa-solid fa-user" style="font-size: 1.5rem; color: var(--text-muted);"></i>
            </div>
            <input type="file" id="reg-avatar" class="form-control" accept="image/*">
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="reg-btn">
          <i class="fa-solid fa-paper-plane"></i> Send Verification OTP
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="font-weight: 600;">Log In</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>

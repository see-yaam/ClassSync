<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ClassSync</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.5rem; font-weight: 700;">Create Your Account</h1>
        <p class="card-subtitle">Join ClassSync as an instructor or learner</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-fullname">Full Name *</label>
          <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Seyam Bhuyan" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="your_email@domain.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="reg-btn">Send Verification OTP</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        Already have an account? <a href="/login.html">Log In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - ClassSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-container">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <h1 style="font-size: 1.5rem; font-weight: 700;">Set New Password</h1>
        <p class="card-subtitle" id="reset-target-email">Enter reset code & your new password</p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label for="reset-otp">6-Digit Reset Code *</label>
          <input type="text" id="reset-otp" class="form-control" placeholder="e.g. 123456" maxlength="6" style="font-size: 1.25rem; letter-spacing: 4px; text-align: center;" required>
        </div>
        <div class="form-group">
          <label for="reset-new-password">New Password *</label>
          <input type="password" id="reset-new-password" class="form-control" placeholder="Minimum 6 characters" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Reset Password</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
        Back to <a href="/login.html">Log In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
